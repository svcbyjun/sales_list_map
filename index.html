<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 타겟 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#131a24;
    --paper:#f4f2ec;
    --panel:#ffffff;
    --line:#e2ded2;
    --brand:#1c3a3a;
    --brand-soft:#e7efe9;
    --high:#c4432b;
    --high-soft:#fbe7e1;
    --mid:#c9891f;
    --mid-soft:#fbf0dc;
    --low:#7a8a94;
    --low-soft:#eef1f2;
    --muted:#6b6558;
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:14px 22px;
    background:var(--brand);
    color:#f4f2ec;
    flex-shrink:0;
    z-index:20;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    background:rgba(244,242,236,0.14);
    padding:3px 7px;
    border-radius:3px;
  }
  .brand h1{
    font-size:17px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .header-stats{
    display:flex;
    gap:18px;
    margin-left:auto;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
  }
  .header-stats span b{
    font-size:14px;
    display:block;
    font-weight:600;
  }
  .search-wrap{
    position:relative;
    width:260px;
  }
  .search-wrap input{
    width:100%;
    padding:8px 12px 8px 32px;
    border-radius:6px;
    border:none;
    background:rgba(244,242,236,0.14);
    color:#f4f2ec;
    font-size:13px;
    outline:none;
  }
  .search-wrap input::placeholder{color:rgba(244,242,236,0.55);}
  .search-wrap input:focus{background:rgba(244,242,236,0.22);}
  .search-wrap svg{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    opacity:0.6;
  }

  /* ---------- Layout ---------- */
  .layout{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* ---------- Sidebar ---------- */
  aside{
    width:380px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .filters{
    display:flex;
    gap:6px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    cursor:pointer;
    transition:all .15s ease;
    letter-spacing:0.02em;
  }
  .chip:hover{border-color:var(--brand);}
  .chip.active{background:var(--brand); color:#f4f2ec; border-color:var(--brand);}
  .chip .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px;}
  .chip[data-p="A"] .dot{background:var(--high);}
  .chip[data-p="B"] .dot{background:var(--mid);}
  .chip[data-p="C"] .dot{background:var(--low);}

  /* ---------- Route panel ---------- */
  .route-panel{
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    background:#fbfaf6;
    flex-shrink:0;
  }
  .route-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .route-title{
    font-size:12.5px;
    font-weight:700;
  }
  .route-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--brand);
    font-weight:600;
    background:var(--brand-soft);
    padding:2px 8px;
    border-radius:10px;
  }
  .route-start{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:8px;
    font-family:'IBM Plex Mono', monospace;
  }
  .route-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .rbtn{
    font-family:'Pretendard', sans-serif;
    font-size:11.5px;
    font-weight:600;
    padding:6px 9px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .rbtn:hover{border-color:var(--brand);}
  .rbtn.ghost{background:transparent; color:var(--muted);}
  .rbtn.primary{
    width:100%;
    background:var(--brand);
    color:#f4f2ec;
    border-color:var(--brand);
    padding:9px;
    font-size:12.5px;
  }
  .rbtn.primary:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .rbtn.primary:not(:disabled):hover{background:#254c4c;}
  .rbtn.active{background:var(--brand); color:#f4f2ec; border-color:var(--brand);}

  .route-result{
    margin-top:10px;
    border-top:1px dashed var(--line);
    padding-top:10px;
  }
  .route-summary{
    display:flex;
    gap:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .route-summary b{color:var(--ink); font-size:12.5px; display:block;}
  .route-stop{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
    font-size:12px;
  }
  .route-stop .seq{
    flex-shrink:0;
    width:20px; height:20px;
    border-radius:50%;
    background:var(--brand);
    color:#f4f2ec;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    font-weight:700;
  }
  .route-stop .seq.home{background:#2c6b6b;}
  .route-stop-name{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .route-note{
    font-size:10.5px;
    color:var(--muted);
    margin-top:6px;
    line-height:1.5;
  }

  .card-check{
    flex-shrink:0;
    width:16px; height:16px;
    margin-top:2px;
    accent-color:var(--brand);
    cursor:pointer;
  }
  .card.in-route{background:var(--brand-soft); border-color:var(--brand);}

  .num-marker{
    width:26px; height:26px;
    border-radius:50%;
    background:var(--brand);
    color:#f4f2ec;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-weight:700;
    font-size:12px;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(19,26,36,0.3);
  }
  .num-marker.home{background:#2c6b6b;}
  .user-dot{
    width:16px; height:16px;
    border-radius:50%;
    background:#2f6fed;
    border:3px solid #fff;
    box-shadow:0 0 0 4px rgba(47,111,237,0.25);
  }

  .sort-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 14px;
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }

  .list{
    flex:1;
    overflow-y:auto;
    padding:6px;
  }
  .card{
    display:flex;
    gap:12px;
    padding:12px 10px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .12s ease, border-color .12s ease;
  }
  .card:hover{background:var(--paper);}
  .card.selected{background:var(--brand-soft); border-color:var(--brand);}

  .score-ring{
    flex-shrink:0;
    width:44px;
    height:44px;
    position:relative;
  }
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    font-weight:600;
  }

  .card-body{min-width:0; flex:1;}
  .card-top{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .card-name{
    font-size:13.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    padding:1.5px 6px;
    border-radius:10px;
    flex-shrink:0;
  }
  .badge.A{background:var(--high-soft); color:var(--high);}
  .badge.B{background:var(--mid-soft); color:var(--mid);}
  .badge.C{background:var(--low-soft); color:var(--low);}

  .card-meta{
    font-size:11.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .card-tags{
    display:flex; gap:4px; flex-wrap:wrap;
  }
  .tag{
    font-size:10px;
    color:var(--brand);
    background:var(--brand-soft);
    padding:1px 6px;
    border-radius:4px;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    padding:40px 20px;
  }

  /* ---------- Map ---------- */
  .map-wrap{flex:1; position:relative;}
  #map{width:100%; height:100%; background:var(--paper);}

  .legend{
    position:absolute;
    bottom:22px;
    left:14px;
    z-index:400;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    font-size:11.5px;
    box-shadow:0 2px 10px rgba(19,26,36,0.08);
  }
  .legend-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.04em;
  }
  .legend-row{display:flex; align-items:center; gap:7px; margin-bottom:4px;}
  .legend-row:last-child{margin-bottom:0;}
  .legend-dot{width:9px; height:9px; border-radius:50%;}

  /* Leaflet popup override */
  .leaflet-popup-content-wrapper{
    border-radius:10px;
    box-shadow:0 6px 24px rgba(19,26,36,0.18);
  }
  .popup-card{font-family:'Pretendard', sans-serif; min-width:220px;}
  .popup-card h3{font-size:14px; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .popup-card .row{font-size:12px; color:var(--muted); margin-bottom:3px; line-height:1.5;}
  .popup-card .row b{color:var(--ink); font-weight:600;}
  .popup-card a{
    display:inline-block; margin-top:8px; font-size:12px;
    color:var(--brand); font-weight:600; text-decoration:none;
    border-bottom:1px solid var(--brand);
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#d8d3c4; border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 820px){
    .layout{flex-direction:column;}
    aside{width:100%; height:42%; border-right:none; border-bottom:1px solid var(--line);}
    .map-wrap{flex:1;}
    .search-wrap{width:170px;}
    .header-stats{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">FIELD MAP</span>
    <h1>영업 타겟 지도</h1>
  </div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="기업명, 업종, 주소 검색" />
  </div>
  <div class="header-stats">
    <span>전체 <b id="stat-total">-</b></span>
    <span>A등급 <b id="stat-high">-</b></span>
    <span>평균점수 <b id="stat-avg">-</b></span>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="filters">
      <div class="chip active" data-p="all">전체</div>
      <div class="chip" data-p="A"><span class="dot"></span>A등급</div>
      <div class="chip" data-p="B"><span class="dot"></span>B등급</div>
      <div class="chip" data-p="C"><span class="dot"></span>C등급</div>
    </div>

    <div class="route-panel">
      <div class="route-head">
        <span class="route-title">오늘의 방문 루트</span>
        <span class="route-count" id="route-count">0 / 6 선택</span>
      </div>
      <div class="route-start" id="route-start-label">출발: 화곡로 350</div>
      <div class="route-actions">
        <button class="rbtn" id="btn-geolocate">📍 내 위치 사용</button>
        <button class="rbtn" id="btn-auto6">가까운 6곳 자동선택</button>
        <button class="rbtn ghost" id="btn-clear-route">선택 초기화</button>
      </div>
      <button class="rbtn primary" id="btn-calc-route" disabled>경로 계산하기</button>
      <div id="route-result" class="route-result" style="display:none;"></div>
    </div>

    <div class="sort-row">
      <span id="count-label">0개 기업</span>
      <span>점수순 정렬</span>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <div class="legend-title">우선순위</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--high)"></span>A등급 — 즉시 컨택</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--mid)"></span>B등급 — 검토 후 컨택</div>
      <div class="legend-row"><span class="legend-dot" style="background:var(--low)"></span>C등급 — 보류</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COLORS = {
  'A': '#c4432b',
  'B': '#c9891f',
  'C': '#7a8a94',
  '기타': '#7a8a94'
};
const MAX_SCORE = 10; // 점수 스케일 (0~10점, 필요시 여기만 수정)

let DATA = [];
let markers = {};
let selectedId = null;
let activeFilter = 'all';

// ---- 방문 루트 상태 ----
const HOME = { lat: 37.5549477, lng: 126.8523571, name: '출발지 (화곡로 350)' };
let startPoint = HOME;
let userMarker = null;
let routeSelection = new Set();   // 선택된 기업 __id
let routeLine = null;
let routeNumMarkers = [];
let homeMarker = null;

const map = L.map('map', { zoomControl: true }).setView([37.556, 126.835], 12);
L.tileLayer('https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19
}).addTo(map);

function renderHomeMarker(){
  if(homeMarker) map.removeLayer(homeMarker);
  const icon = L.divIcon({ className:'', html:`<div class="num-marker home">🏠</div>`, iconSize:[26,26], iconAnchor:[13,13] });
  homeMarker = L.marker([startPoint.lat, startPoint.lng], {icon, zIndexOffset:1000})
    .bindPopup(`<b>${startPoint.name}</b>`)
    .addTo(map);
}
renderHomeMarker();

function priorityKey(p){
  if(!p) return '기타';
  if(COLORS[p]) return p;
  return '기타';
}

function scoreColor(score){
  const s = (score===null || score===undefined) ? MAX_SCORE*0.5 : score;
  const pct = s / MAX_SCORE;
  if(pct>=0.7) return COLORS['A'];
  if(pct>=0.4) return COLORS['B'];
  return COLORS['C'];
}

function makeMarker(item, id){
  const pk = priorityKey(item.priority);
  const color = COLORS[pk] !== '#7a8a94' || pk!=='기타' ? COLORS[pk] : scoreColor(item.score);
  const scorePct = Math.min(1, Math.max(0, (item.score||0)/MAX_SCORE));
  const radius = 6 + scorePct*10;
  const m = L.circleMarker([item.lat, item.lng], {
    radius: radius,
    color: '#ffffff',
    weight: 2,
    fillColor: color,
    fillOpacity: 0.92
  });
  m.bindPopup(popupHtml(item), {maxWidth: 260});
  m.on('click', () => selectItem(id, true));
  return m;
}

function popupHtml(item){
  const tagList = safeTags(item.industry).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
  return `
    <div class="popup-card">
      <h3>${item.name||'-'}</h3>
      <div class="row"><b>대표</b> ${item.ceo||'-'} · <b>사원수</b> ${item.employees||'-'}</div>
      <div class="row"><b>매출</b> ${item.revenue||'-'}</div>
      <div class="row"><b>주소</b> ${item.address||'-'}</div>
      <div class="row"><b>점수</b> ${item.score ?? '-'} 점 ${item.reason ? '· '+item.reason : ''}</div>
      <div style="display:flex; gap:4px; flex-wrap:wrap; margin-top:6px;">${tagList}</div>
      ${item.detail_url ? `<a href="${item.detail_url}" target="_blank">상세페이지 →</a>` : ''}
    </div>
  `;
}

function safeTags(industry){
  if(!industry) return [];
  if(Array.isArray(industry)) return industry;
  const m = String(industry).match(/'([^']+)'/g);
  if(m) return m.map(s=>s.replace(/'/g,''));
  return [String(industry)];
}

function scoreRingSvg(score){
  const s = Math.max(0, Math.min(MAX_SCORE, score||0));
  const pct = s / MAX_SCORE;
  const r = 18, c = 2*Math.PI*r;
  const offset = c - pct*c;
  const color = scoreColor(s);
  const label = (score===null || score===undefined) ? '-' : (Number.isInteger(score) ? score : score.toFixed(1));
  return `
    <svg width="44" height="44" viewBox="0 0 44 44">
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="#eee7d8" stroke-width="4"/>
      <circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="4"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
    </svg>
    <div class="num">${label}</div>
  `;
}

function renderList(){
  const list = document.getElementById('list');
  const q = document.getElementById('search').value.trim().toLowerCase();

  let filtered = DATA.filter(d => {
    if(activeFilter !== 'all' && priorityKey(d.priority) !== activeFilter) return false;
    if(!q) return true;
    const hay = `${d.name||''} ${d.address||''} ${d.industry||''} ${d.ceo||''}`.toLowerCase();
    return hay.includes(q);
  });
  filtered.sort((a,b) => (b.score||0) - (a.score||0));

  document.getElementById('count-label').textContent = `${filtered.length}개 기업`;

  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty">조건에 맞는 기업이 없습니다</div>`;
    return;
  }

  list.innerHTML = filtered.map(d => `
    <div class="card ${d.__id===selectedId?'selected':''} ${routeSelection.has(d.__id)?'in-route':''}" data-id="${d.__id}">
      <input type="checkbox" class="card-check" data-id="${d.__id}" ${routeSelection.has(d.__id)?'checked':''} title="오늘 방문 루트에 추가" />
      <div class="score-ring">${scoreRingSvg(d.score)}</div>
      <div class="card-body">
        <div class="card-top">
          <span class="card-name">${d.name||'-'}</span>
          <span class="badge ${priorityKey(d.priority)}">${d.priority||'-'}</span>
        </div>
        <div class="card-meta">${d.address||'-'}</div>
        <div class="card-tags">${safeTags(d.industry).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
    </div>
  `).join('');

  filtered.forEach(d => {
    const m = makeMarker(d, d.__id);
    m.addTo(map);
    markers[d.__id] = m;
  });

  list.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      if(e.target.classList.contains('card-check')) return;
      selectItem(parseInt(card.dataset.id), false);
    });
  });
  list.querySelectorAll('.card-check').forEach(cb => {
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', (e) => toggleRouteSelection(parseInt(e.target.dataset.id), e.target.checked));
  });
}

function selectItem(id, fromMap){
  selectedId = id;
  const item = DATA.find(d => d.__id === id);
  if(!item) return;

  document.querySelectorAll('.card').forEach(c => {

const MAX_ROUTE_STOPS = 10;

function toggleRouteSelection(id, checked){

      alert(`하루 최대 ${MAX_ROUTE_STOPS}곳까지만 선택할 수 있어요.`);
      const cb = document.querySelector(`.card-check[data-id="${id}"]`);

  document.querySelector(`.card[data-id="${id}"]`)?.classList.toggle('in-route', checked);
  updateRouteCount();
  clearRouteResult();
}

async function fetchOsrmTrip(coords){
  // coords: [{lat,lng}, ...] 첫 번째가 출발지
  const coordStr = coords.map(c => `${c.lng},${c.lat}`).join(';');
  const url = `https://router.project-osrm.org/trip/v1/driving/${coordStr}?roundtrip=false&source=first&destination=any&overview=full&geometries=geojson`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('OSRM 응답 실패');
  const data = await res.json();
  if(data.code !== 'Ok') throw new Error('OSRM 경로 계산 실패: ' + data.code);
  return data;
}

function nearestNeighborOrder(start, stops){
  // OSRM 실패시 폴백: 단순 최근접 이웃 휴리스틱 (직선거리 기준)
  const remaining = [...stops];
  const order = [];
  let cur = start;
  while(remaining.length){
    let bestIdx = 0, bestDist = Infinity;
    remaining.forEach((s, i) => {
      const d = haversine(cur.lat, cur.lng, s.lat, s.lng);
      if(d < bestDist){ bestDist = d; bestIdx = i; }
    });
    const next = remaining.splice(bestIdx, 1)[0];
    order.push(next);
    cur = next;
  }
  return order;
}

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function drawRoute(orderedStops, geometry){
  clearRouteResult();

  // 순번 마커
  orderedStops.forEach((s, i) => {
    const icon = L.divIcon({ className:'', html:`<div class="num-marker">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
    const m = L.marker([s.lat, s.lng], {icon, zIndexOffset:500})
      .bindPopup(`<b>${i+1}. ${s.name}</b><br>${s.address||''}`)
      .addTo(map);
    routeNumMarkers.push(m);
  });

  // 경로선
  let latlngs;
  if(geometry){
    latlngs = geometry.coordinates.map(c => [c[1], c[0]]);
  } else {
    latlngs = [[startPoint.lat, startPoint.lng], ...orderedStops.map(s=>[s.lat, s.lng])];
  }
  routeLine = L.polyline(latlngs, { color:'#1c3a3a', weight:4, opacity:0.85, dashArray: geometry ? null : '6 6' }).addTo(map);

  const bounds = L.latLngBounds([[startPoint.lat, startPoint.lng], ...orderedStops.map(s=>[s.lat,s.lng])]);
  map.fitBounds(bounds, {padding:[50,50]});
}

function renderRouteResult(orderedStops, distanceKm, durationMin, isFallback){
  const box = document.getElementById('route-result');
  const stopsHtml = [
    `<div class="route-stop"><div class="seq home">🏠</div><div class="route-stop-name">${startPoint.name}</div></div>`,
    ...orderedStops.map((s,i) => `<div class="route-stop"><div class="seq">${i+1}</div><div class="route-stop-name">${s.name}</div></div>`)
  ].join('');

  box.innerHTML = `
    <div class="route-summary">
      <div><b>${distanceKm.toFixed(1)} km</b>총 이동거리</div>
      <div><b>${Math.round(durationMin)}분</b>예상 소요시간</div>
    </div>
    ${stopsHtml}
    <div class="route-note">${isFallback
      ? '⚠️ 실시간 도로 경로 계산에 실패해 직선거리 기준 순서로 대체했어요. 실제 도로 상황과 다를 수 있어요.'
      : '오픈소스 라우팅(OSRM) 기준 추정치이며, 실제 소요시간은 교통 상황에 따라 달라질 수 있어요.'}</div>
  `;
  box.style.display = 'block';
}

document.getElementById('btn-calc-route').addEventListener('click', async () => {
  const btn = document.getElementById('btn-calc-route');
  const selectedStops = DATA.filter(d => routeSelection.has(d.__id));
  if(selectedStops.length === 0) return;

  btn.disabled = true;
  btn.textContent = '경로 계산 중...';

  try {
    const coords = [startPoint, ...selectedStops];
    const trip = await fetchOsrmTrip(coords);

    // waypoints[0]은 출발지, waypoint_index로 방문 순서 확인
    const wps = trip.waypoints.slice(1); // 출발지 제외
    const ordered = wps
      .map((w, i) => ({ stop: selectedStops[i], order: w.waypoint_index }))
      .sort((a,b) => a.order - b.order)
      .map(x => x.stop);

    const leg = trip.trips[0];
    drawRoute(ordered, leg.geometry);
    renderRouteResult(ordered, leg.distance/1000, leg.duration/60, false);
  } catch(err){
    console.warn('OSRM 실패, 직선거리 폴백 사용:', err);
    const ordered = nearestNeighborOrder(startPoint, selectedStops);
    let totalKm = 0;
    let cur = startPoint;
    ordered.forEach(s => { totalKm += haversine(cur.lat, cur.lng, s.lat, s.lng); cur = s; });
    const estMin = totalKm / 30 * 60; // 시속 30km 가정
    drawRoute(ordered, null);
    renderRouteResult(ordered, totalKm, estMin, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '경로 계산하기';
  }
});
